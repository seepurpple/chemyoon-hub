<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemyoon Hub</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('chemyoon-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --page: #eff4f0; --panel: #ffffff; --card: #eaf4ec; --text: #132019; --muted: #526158; --line: #d4e1d6; --input: #ffffff; --button: #1e6b39; --button-hover: #15542c; --shadow: #18301a16; --app: #4e357f; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #0b120e; --panel: #131d16; --card: #19281d; --text: #f0f7f1; --muted: #b5c2b7; --line: #33483a; --input: #101a13; --button: #42a866; --button-hover: #59bd7a; --shadow: #00000055; --app: #4e357f; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); background: radial-gradient(circle at top, #d7e9d9 0, var(--page) 42%); transition: background .2s, color .2s; }
    :root[data-theme="dark"] body { background: radial-gradient(circle at top, #1e3c27 0, var(--page) 48%); }
    main { width: min(100%, 700px); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: clamp(28px, 6vw, 56px); box-shadow: 0 20px 60px var(--shadow); }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }.eyebrow { margin: 0 0 12px; color: #34733c; font-size: .78rem; font-weight: 800; letter-spacing: .12em; } h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.2rem); letter-spacing: -.07em; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.7; }.card { margin-top: 28px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); } h2 { margin: 0 0 10px; font-size: 1.1rem; }
    form { display: grid; gap: 12px; margin-top: 18px; } label { display: grid; gap: 6px; font-size: .9rem; font-weight: 700; } input, button { min-height: 46px; border-radius: 11px; font: inherit; } input { color: var(--text); border: 1px solid var(--line); background: var(--input); padding: 10px 12px; } button { border: 0; padding: 12px; background: var(--button); color: white; font-weight: 800; cursor: pointer; } button:hover { background: var(--button-hover); }.theme-toggle { min-height: 38px; padding: 8px 11px; color: var(--text); border: 1px solid var(--line); background: transparent; font-size: .82rem; }.theme-toggle:hover { color: white; background: #285d38; }
    .error { min-height: 1.4em; margin: 12px 0 0; color: #d85c51; font-weight: 700; } [hidden] { display: none !important; } ul { padding: 0; margin: 20px 0 0; list-style: none; display: grid; gap: 11px; } li { border-radius: 12px; overflow: hidden; } li a { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 14px 17px; color: white; font-weight: 800; text-decoration: none; background: var(--app); box-shadow: inset 0 0 0 1px #ffffff22, 0 6px 14px #00000018; transition: transform .15s, filter .15s; } li a:hover { filter: brightness(1.12); transform: translateY(-2px); } li a span { padding: 4px 8px; border-radius: 999px; background: #ffffff22; font-size: .83rem; white-space: nowrap; }#logout { width: 100%; margin-top: 28px; color: var(--text); border: 1px solid var(--line); background: transparent; }#logout:hover { color: white; background: #9b3342; }small { display: block; margin-top: 20px; color: var(--muted); text-align: center; }
    @media (max-width: 480px) { body { padding: 12px; } main { border-radius: 18px; padding: 28px 22px; }.topline { align-items: flex-start; }.eyebrow { line-height: 1.4; }.theme-toggle { flex: 0 0 auto; } }
  </style>
</head>
<body>
  <main>
    <div class="topline"><p class="eyebrow">CHEMYOON PERSONAL APPS</p><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"></button></div><h1>Hub</h1>
    <section id="login"><p>한 번 로그인으로 개인용 앱을 여는 통합 허브입니다.</p><div class="card"><h2>로그인</h2><form id="login-form"><label>ID<input name="identifier" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><p id="error" class="error" aria-live="polite"></p></div></section>
    <section id="welcome" hidden><p id="greeting"></p><div class="card"><h2>내 앱</h2><p>공통 로그인으로 아래 앱을 바로 엽니다.</p><ul><li><a href="https://literacy.chemyoon.kr">교육과정 리터러시 <span>열기 →</span></a></li><li><a href="https://memo.chemyoon.kr">개인 메모장 <span>열기 →</span></a></li><li><a href="https://schedule.chemyoon.kr">교사 스케쥴 관리 <span>열기 →</span></a></li><li><a href="https://rubric.chemyoon.kr">루브릭 생성기 <span>열기 →</span></a></li><li><a href="https://gongmun.chemyoon.kr">공문 작성기 <span>열기 →</span></a></li><li><a href="https://classroom-rule-system.vercel.app" target="_blank" rel="noopener">모두의 역할 <span>열기 →</span></a></li></ul><button id="logout" type="button">로그아웃</button></div></section>
    <small>비밀번호, API 키, 개인 데이터는 이 공개 저장소에 포함되지 않습니다.</small>
  </main>
  <script>
    const login = document.querySelector('#login'), welcome = document.querySelector('#welcome'), error = document.querySelector('#error'), themeToggle = document.querySelector('#theme-toggle');
    function setTheme(theme, save = true) { document.documentElement.dataset.theme = theme; themeToggle.textContent = theme === 'dark' ? '라이트 모드' : '다크 모드'; themeToggle.setAttribute('aria-pressed', String(theme === 'dark')); if (save) try { localStorage.setItem('chemyoon-theme', theme); } catch {} }
    setTheme(document.documentElement.dataset.theme, false);
    themeToggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    function show(user) { login.hidden = true; welcome.hidden = false; document.querySelector('#greeting').textContent = `${user}님, 로그인되었습니다.`; }
    async function session() { const response = await fetch('/api/hub/auth/session'); const data = await response.json(); if (data.authenticated) show(data.identifier); }
    document.querySelector('#login-form').addEventListener('submit', async (event) => { event.preventDefault(); error.textContent = ''; const form = new FormData(event.currentTarget); const response = await fetch('/api/hub/auth/login', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(Object.fromEntries(form)) }); const data = await response.json(); if (!response.ok) { error.textContent = data.message || data.error || '로그인에 실패했습니다.'; return; } show(data.identifier); });
    document.querySelector('#logout').addEventListener('click', async () => { await fetch('/api/hub/auth/logout', {method: 'POST'}); welcome.hidden = true; login.hidden = false; document.querySelector('#login-form').reset(); });
    session();
  </script>
</body>
</html>
